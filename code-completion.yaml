$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/code-completion/0.1.0
source: main.ts
license: MIT
locale: en-US
id: cc_bank_account
title: Complete the BankAccount TypeScript Implementation
description: Fill in the essential TypeScript keywords, operators, and method calls to enforce contracts, update state, and validate transactions.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: code-completion
  difficulty: novice
  prereq_topics:
    - basic-syntax
    - variables
  topics:
    - interfaces
    - classes
    - arithmetic
    - relational-operators
    - methods
runtime:
  language: typescript
  version: 5.0
statement: |
  Complete the typed `BankAccount` class implementation by selecting the correct keywords, operators, and method identifiers.
  Make sure to:
  1. Enforce the `IBankAccount` interface contract on the class.
  2. Correctly increment the balance during a deposit.
  3. Ensure that withdrawal requests do not exceed the available balance.
  4. Invoke the proper transaction method in the `main` driver function.
testcases:
  - title: Bob's Account
    visible: true
    stdin: []
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    status: pass
    hints:
      - "Review the blanks and ensure the operations match the expected transaction flow."
      - "Pay attention to conditional checks and return or print statements."
    feedback:
      - on_pass:
          - explanations:
              - "Great job! All blanks were completed correctly and produced the expected output."
        on_fail:
          - explanations:
              - "One or more blanks are incorrect. Check the expected output and verify your selections."
elements:
  - type: blank
    location:
      context: class BankAccount implements IBankAccount {
      snippet: implements
      nth: 1
    choices:
      - snippet: implements
        role: solution
        explanations:
          - body: |
              Correct! In TypeScript, the `implements` keyword declares that a class must adhere to the structural contract defined by an `interface` (`IBankAccount`).
      - snippet: extends
        role: distractor
        explanations:
          - body: |
              Incorrect. In TypeScript and JavaScript, `extends` is used for **class inheritance** (inheriting from a parent class) or interface inheritance, whereas `implements` is used when a class implements an interface contract.
      - snippet: instanceof
        role: distractor
        explanations:
          - body: |
              Incorrect. `instanceof` is a runtime operator used in expressions to test whether an object's prototype chain contains the prototype of a constructor function, not a declaration keyword.
      - snippet: satisfies
        role: distractor
        explanations:
          - body: |
              Incorrect. `satisfies` is a TypeScript expression operator used to validate that an expression matches a type without widening it; it cannot be used in a class declaration clause.
  - type: blank
    location:
      context: this.balance = this.balance + amount;
      snippet: +
      nth: 1
    choices:
      - snippet: +
        role: solution
        explanations:
          - body: |
              Correct! The addition operator (`+`) adds the deposited `amount` to the current `this.balance`, increasing the total funds.
      - snippet: '-'
        role: distractor
        explanations:
          - body: |
              Incorrect. The subtraction operator (`-`) would deduct money from the account during a deposit instead of crediting it.
      - snippet: '*'
        role: distractor
        explanations:
          - body: |
              Incorrect. The multiplication operator (`*`) would multiply the existing balance by the deposit amount, yielding an incorrect balance.
      - snippet: '='
        role: distractor
        explanations:
          - body: |
              Incorrect. Using `=` here would result in a syntax error (`this.balance = this.balance = amount;`) or simply overwrite the balance with `amount` rather than accumulating funds.
  - type: blank
    location:
      context: if (0 < amount && amount <= this.balance) {
      snippet: <=
      nth: 1
    choices:
      - snippet: <=
        role: solution
        explanations:
          - body: |
              Correct! The less-than-or-equal operator (`<=`) ensures the user has sufficient funds, allowing withdrawals up to and including the exact total balance without overdrafting.
      - snippet: <
        role: distractor
        explanations:
          - body: |
              Incorrect. The strictly-less-than operator (`<`) would prevent account holders from withdrawing their exact entire balance (withdrawing down to zero).
      - snippet: '>='
        role: distractor
        explanations:
          - body: |
              Incorrect. Using `>=` would invert the business logic, permitting withdrawals only when the amount is greater than or equal to the balance, guaranteeing an overdraft.
      - snippet: '>'
        role: distractor
        explanations:
          - body: |
              Incorrect. Using `>` would only permit transactions that exceed the current balance, causing an immediate overdraft into negative funds.
  - type: blank
    location:
      context: account.deposit(100);
      snippet: deposit
      nth: 1
    choices:
      - snippet: deposit
        role: solution
        explanations:
          - body: |
              Correct! Invokes the `deposit` method with an argument of `100` to credit the account.
      - snippet: withdraw
        role: distractor
        explanations:
          - body: |
              Incorrect. Invoking `withdraw(100)` would debit the account instead of performing the required deposit transaction.
      - snippet: balance
        role: distractor
        explanations:
          - body: |
              Incorrect. `balance` is a numeric property, not a callable method function; attempting `account.balance(100)` causes a TypeScript compilation error.
