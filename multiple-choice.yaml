id: mcq_bank_account_deposit
title: TypeScript Class Deposit Method Implementation
description: Choose the correct implementation of a typed deposit method adhering to the IBankAccount interface contract.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: multiple-choice-question
  difficulty: intermediate
  prereq_topics:
    - basic-syntax
    - classes
    - types
  topics:
    - interfaces
    - classes
    - methods
    - types
    - variable-scope
include_choices: 4
question: |
  Given the following TypeScript interface and class skeleton:
  
  ```typescript
  interface IBankAccount {
      owner: string;
      balance: number;
      deposit(amount: number): number;
  }

  class BankAccount implements IBankAccount {
      owner: string;
      balance: number;

      constructor(owner: string, balance: number) {
          this.owner = owner;
          this.balance = balance;
      }
  }
  ```
  
  Which of the following represents the correct, type-safe implementation for the `deposit` method in `BankAccount` that enforces positive deposit amounts, updates instance state, and satisfies the `IBankAccount` contract?
choices:
  - body: |
      ```typescript
      deposit(amount: number): number {
          if (amount > 0) {
              this.balance += amount;
              return this.balance;
          }
          throw new Error("Deposit amount must be positive");
      }
      ```
    role: solution
    include: always
    order: 1
    explanations:
      - body: |
          Correct! This implementation:
          1. Satisfies the `IBankAccount` signature (`deposit(amount: number): number`).
          2. Validates that the input `amount` is strictly positive (`amount > 0`).
          3. Correctly mutates instance state using `this.balance += amount`.
          4. Returns the updated numeric balance.
  - body: |
      ```typescript
      deposit(amount: string): number {
          if (amount.length > 0) {
              this.balance += Number(amount);
              return this.balance;
          }
          return this.balance;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. Specifying `amount: string` violates the `IBankAccount` interface contract (`deposit(amount: number): number`), causing a TypeScript compile-time type mismatch error.
  - body: |
      ```typescript
      deposit(amount: number): number {
          if (amount > 0) {
              this.balance =+ amount;
              return this.balance;
          }
          return this.balance;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. The operator `=+` is a unary positive assignment (`this.balance = +amount`), which replaces and overwrites the balance with `amount` rather than accumulating funds with `+=`.
  - body: |
      ```typescript
      deposit(amount: number): number {
          if (amount > 0) {
              balance += amount;
              return balance;
          }
          return balance;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. Omits the `this.` keyword (`balance += amount`). In TypeScript and JavaScript classes, instance properties must be accessed via `this.balance`; omitting `this.` causes a compile error / runtime `ReferenceError: balance is not defined`.
