runtime:
  language: typescript
statement: |
  In the `main` function, write the TypeScript code to interact with the `BankAccount` class:
  1. Instantiate a new `BankAccount` named `account` for owner `"Bob"` with an initial balance of `200`.
  2. Call `deposit` with an amount of `100`.
  3. Call `withdraw` with an amount of `50`.
  4. Print the final balance to the console in the format: `Balance: <balance>`.
executions:
  - title: Standard Transaction Sequence
    stdin: []
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    status: pass
elements:
  - type: locked
    location:
      snippet: |-
        interface IBankAccount {
            owner: string;
            balance: number;
            deposit(amount: number): number;
            withdraw(amount: number): number;
        }

        class BankAccount implements IBankAccount {
            owner: string;
            balance: number;

            constructor(owner: string, balance: number) {
                this.owner = owner;
                this.balance = balance;
            }

            deposit(amount: number): number {
                if (amount > 0) {
                    this.balance = this.balance + amount;
                    console.log(`Deposited ${amount}`);
                }
                return this.balance;
            }

            withdraw(amount: number): number {
                if (0 < amount && amount <= this.balance) {
                    this.balance = this.balance - amount;
                    console.log(`Withdrew ${amount}`);
                } else {
                    console.log("Insufficient funds");
                }
                return this.balance;
            }
        }
  - type: editable
    location:
      snippet: |-
            const account: BankAccount = new BankAccount("Bob", 200);
            account.deposit(100);
            account.withdraw(50);
            console.log(`Balance: ${account.balance}`);
    placeholder: |-
      // 1. Create a BankAccount for "Bob" with 200 initial balance

          // 2. Deposit 100

          // 3. Withdraw 50

          // 4. Print `Balance: ${account.balance}`
