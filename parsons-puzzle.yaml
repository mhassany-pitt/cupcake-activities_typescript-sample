$schema: https://learning-contents.org/schemas/parsons-puzzles/0.1.0
license: MIT
locale: en-US
id: pp_bank_account
source: main.ts
title: Bank Account Methods and Constructor in TypeScript
description: Rearrange the TypeScript methods and constructor to properly manage BankAccount instance state and enforce transaction safety.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: parsons-puzzles
  difficulty: novice
  prereq_topics:
    - basic-syntax
    - classes
  topics:
    - classes
    - constructors
    - methods
    - conditional-logic
    - variable-scope
runtime:
  language: typescript
statement: |
  Rearrange the blocks to correctly implement the constructor and methods for the `BankAccount` class in TypeScript.
  Make sure to:
  1. Initialize the instance properties (`owner` and `balance`) using `this`.
  2. Implement the `deposit` method with positive input validation.
  3. Implement the `withdraw` method with strict overdraft protection and insufficient funds notification.
executions:
  - title: Standard Transaction
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    status: pass
elements:
  - type: block
    group: bank-members
    location:
      snippet: |-
            constructor(owner: string, balance: number) {
                this.owner = owner;
                this.balance = balance;
            }
    choices:
      - snippet: |-
            constructor(owner: string, balance: number) {
                this.owner = owner;
                this.balance = balance;
            }
        role: solution
        explanations:
          - body: |
              Correct! Uses `this.owner = owner` and `this.balance = balance` to bind constructor argument values to the new instance properties.
      - snippet: |-
            constructor(owner: string, balance: number) {
                owner = owner;
                balance = balance;
            }
        role: distractor
        explanations:
          - body: |
              Incorrect. Without the `this.` prefix, `owner = owner` assigns constructor parameters back to themselves (parameter shadowing) without updating the actual instance properties `this.owner` and `this.balance`.
  - type: block
    group: bank-members
    location:
      snippet: |-
            deposit(amount: number): number {
                if (amount > 0) {
                    this.balance = this.balance + amount;
                    console.log(`Deposited ${amount}`);
                }
                return this.balance;
            }
    choices:
      - snippet: |-
            deposit(amount: number): number {
                if (amount > 0) {
                    this.balance = this.balance + amount;
                    console.log(`Deposited ${amount}`);
                }
                return this.balance;
            }
        role: solution
        explanations:
          - body: |
              Correct! Validates that `amount > 0` before updating `this.balance`, logs the confirmation message, and returns the updated balance.
      - snippet: |-
            deposit(amount: number): number {
                this.balance = this.balance + amount;
                console.log(`Deposited ${amount}`);
                return this.balance;
            }
        role: distractor
        explanations:
          - body: |
              Incorrect. Omits the `if (amount > 0)` input validation guard, which would allow negative or zero deposit amounts to erroneously corrupt account balances.
      - snippet: |-
            deposit(amount: number): number {
                if (amount > 0) {
                    this.balance = this.balance - amount;
                    console.log(`Deposited ${amount}`);
                }
                return this.balance;
            }
        role: distractor
        explanations:
          - body: |
              Incorrect. Uses subtraction (`-`) instead of addition (`+`), deducting money from the account balance during a deposit transaction.
  - type: block
    group: bank-members
    location:
      snippet: |-
            withdraw(amount: number): number {
                if (0 < amount && amount <= this.balance) {
                    this.balance = this.balance - amount;
                    console.log(`Withdrew ${amount}`);
                } else {
                    console.log("Insufficient funds");
                }
                return this.balance;
            }
    choices:
      - snippet: |-
            withdraw(amount: number): number {
                if (0 < amount && amount <= this.balance) {
                    this.balance = this.balance - amount;
                    console.log(`Withdrew ${amount}`);
                } else {
                    console.log("Insufficient funds");
                }
                return this.balance;
            }
        role: solution
        explanations:
          - body: |
              Correct! Verifies that `0 < amount` and `amount <= this.balance`, debits the account when funds are sufficient, logs an error when funds are insufficient, and returns `this.balance`.
      - snippet: |-
            withdraw(amount: number): number {
                this.balance = this.balance - amount;
                console.log(`Withdrew ${amount}`);
                return this.balance;
            }
        role: distractor
        explanations:
          - body: |
              Incorrect. Unconditionally deducts `amount` without verifying if `amount <= this.balance`, allowing the account balance to plunge into negative numbers.
      - snippet: |-
            withdraw(amount: number): number {
                if (0 < amount && amount > this.balance) {
                    this.balance = this.balance - amount;
                    console.log(`Withdrew ${amount}`);
                } else {
                    console.log("Insufficient funds");
                }
                return this.balance;
            }
        role: distractor
        explanations:
          - body: |
              Incorrect. The comparison `amount > this.balance` inverts the logic: it only allows withdrawals when the amount exceeds the balance, guaranteeing an overdraft on every successful withdrawal!
