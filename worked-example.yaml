statement: |
  This worked example demonstrates how `BankAccount` state and operations are modeled in TypeScript using interfaces, classes, and strong type annotations. We'll examine:
  1. The `IBankAccount` interface defining the structural contract.
  2. The `BankAccount` class implementing the interface with instance state and a constructor.
  3. The `deposit` method with positive input validation.
  4. The `withdraw` method with compound guard logic protecting against overdrafts.
  5. The `main` execution function demonstrating instantiation, method calls, and state inspection.
